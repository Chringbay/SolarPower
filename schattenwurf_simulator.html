<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Schattenwurf-Simulator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0e1420;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#eee;}
  #canvas-wrap{position:relative;width:100vw;height:100vh;}
  canvas{display:block;}
  #panel{
    position:absolute;top:12px;left:12px;
    background:rgba(20,24,34,0.85);backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:10px;padding:14px 16px;width:300px;
    box-shadow:0 4px 20px rgba(0,0,0,0.4);
  }
  #panel h1{font-size:14px;margin:0 0 10px 0;font-weight:600;letter-spacing:0.3px;color:#fff;}
  .row{margin-bottom:12px;}
  .row label{display:flex;justify-content:space-between;font-size:12px;color:#aab;margin-bottom:4px;}
  .row label b{color:#fff;font-weight:600;}
  input[type=range]{width:100%;accent-color:#4ea1ff;}
  #readout{font-size:11.5px;color:#9aa4bb;line-height:1.6;border-top:1px solid rgba(255,255,255,0.1);padding-top:10px;margin-top:4px;}
  #readout span{color:#e6ecff;font-weight:600;}
  #warn{color:#ffb454;font-weight:600;}
  #hint{position:absolute;bottom:10px;left:12px;font-size:11px;color:#6b7690;}
  button{
    background:#2a3348;border:1px solid rgba(255,255,255,0.15);color:#dfe6ff;
    border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;margin-right:6px;margin-top:2px;
  }
  button:hover{background:#37436190;}
</style>
</head>
<body>
<div id="canvas-wrap">
  <div id="panel">
    <h1>☀ Schattenwurf-Simulator — Testausschnitt</h1>
    <div class="row">
      <label>Datum <b id="dateLabel">–</b></label>
      <input type="range" id="dateSlider" min="1" max="365" value="355">
      <div style="margin-top:4px;">
        <button data-doy="80">Frühlingsäquinoktium</button>
        <button data-doy="172">Sommersonnenwende</button>
        <button data-doy="266">Herbstäquinoktium</button>
        <button data-doy="355">Wintersonnenwende</button>
      </div>
    </div>
    <div class="row">
      <label>Uhrzeit (lokal) <b id="timeLabel">–</b></label>
      <input type="range" id="timeSlider" min="5" max="21" step="0.1" value="12">
    </div>
    <div id="readout"></div>
    <div style="margin-top:8px;font-size:11px;color:#ff8080;">— rote Linien: Flurstücksgrenzen</div>
  </div>
  <div id="hint">Maus ziehen = drehen · Scrollen = zoomen · roter Pfeil = Norden</div>
</div>

84, 133.05], [-21.46, 8.03, 129.21]]]; // Flurstücksgrenzen, bereits in lokale Grid-Koordinaten [x,y,z] umgerechnet
const LAT = 49.4128, LON = 8.9297; // ungefähres Zentrum des Ausschnitts (WGS84)

function b64ToFloat32Array(b64) {
  const binary = atob(b64);
  const buf = new ArrayBuffer(binary.length);
  const view = new Uint8Array(buf);
  for (let i = 0; i < binary.length; i++) view[i] = binary.charCodeAt(i);
  return new Float32Array(buf);
}
const heights = b64ToFloat32Array(HEIGHTS_B64); // Länge W*H, Zeile 0 = Nordrand

let minH = Infinity, maxH = -Infinity;
for (let i = 0; i < heights.length; i++) {
  if (heights[i] < minH) minH = heights[i];
  if (heights[i] > maxH) maxH = heights[i];
}

// ---------------------------------------------------------------
// 2. Sonnenpositions-Berechnung (Algorithmus wie SunCalc.js, MIT-lizenziert)
// ---------------------------------------------------------------
const RAD = Math.PI / 180;
const DAY_MS = 864e5, J1970 = 2440588, J2000 = 2451545, OBLIQ = RAD * 23.4397;
function toDays(date) { return date.getTime() / DAY_MS - 0.5 + J1970 - J2000; }
function solarMeanAnomaly(d) { return RAD * (357.5291 + 0.98560028 * d); }
function eclipticLongitude(M) {
  const C = RAD * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2*M) + 0.0003 * Math.sin(3*M));
  return M + C + RAD * 102.9372 + Math.PI;
}
function declination(l) { return Math.asin(Math.sin(l) * Math.sin(OBLIQ)); }
function rightAscension(l) { return Math.atan2(Math.sin(l) * Math.cos(OBLIQ), Math.cos(l)); }
function siderealTime(d, lw) { return RAD * (280.16 + 360.9856235 * d) - lw; }
function sunPosition(date, lat, lng) {
  const lw = RAD * -lng, phi = RAD * lat, d = toDays(date);
  const M = solarMeanAnomaly(d), L = eclipticLongitude(M);
  const dec = declination(L), ra = rightAscension(L);
  const H_ = siderealTime(d, lw) - ra;
  const altitude = Math.asin(Math.sin(phi)*Math.sin(dec) + Math.cos(phi)*Math.cos(dec)*Math.cos(H_));
  const azimuth = Math.atan2(Math.sin(H_), Math.cos(H_)*Math.sin(phi) - Math.tan(dec)*Math.cos(phi));
  return { azimuth, altitude }; // azimuth: 0=Süd, +=Richtung Westen; altitude: 0=Horizont
}
function isDST(date) {
  const y = date.getUTCFullYear();
  const lastSunday = (year, month) => { const d = new Date(Date.UTC(year, month, 1)); d.setUTCMonth(month+1,0); d.setUTCDate(d.getUTCDate()-d.getUTCDay()); return d; };
  const start = lastSunday(y,2), end = lastSunday(y,9);
  return date >= start && date < end;
}
function buildUTCDate(dayOfYear, localHour) {
  const base = new Date(Date.UTC(2026, 0, 1));
  base.setUTCDate(dayOfYear);
  const dst = isDST(base);
  const offset = dst ? 2 : 1;
  const d = new Date(base.getTime());
  d.setUTCHours(0,0,0,0);
  d.setUTCMilliseconds(Math.round((localHour - offset) * 3600000));
  return { date: d, dst };
}

// ---------------------------------------------------------------
// 3. Three.js Szene
// ---------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1420);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.5, 3000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvas-wrap').appendChild(renderer.domElement);

// --- Terrain-Geometrie aus Höhenraster ---
const positions = new Float32Array(W*H*3);
const uvs = new Float32Array(W*H*2);
for (let r = 0; r < H; r++) {
  for (let c = 0; c < W; c++) {
    const idx = r*W + c;
    positions[idx*3+0] = c;
    positions[idx*3+1] = heights[idx] - minH;
    positions[idx*3+2] = r;
    uvs[idx*2+0] = c/(W-1);
    uvs[idx*2+1] = 1 - r/(H-1);
  }
}
const indices = [];
for (let r = 0; r < H-1; r++) {
  for (let c = 0; c < W-1; c++) {
    const a = r*W+c, b = a+1, cc = a+W, d = cc+1;
    indices.push(a, cc, b, b, cc, d);
  }
}
const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
geometry.setIndex(indices);
geometry.computeVertexNormals();

const texture = new THREE.TextureLoader().load('data:image/jpeg;base64,' + TEXTURE_B64);
texture.colorSpace = THREE.SRGBColorSpace;

const material = new THREE.MeshStandardMaterial({ map: texture, roughness: 1.0, metalness: 0.0 });
const terrain = new THREE.Mesh(geometry, material);
terrain.receiveShadow = true;
terrain.castShadow = true;
scene.add(terrain);

const centerX = (W-1)/2, centerZ = (H-1)/2, centerY = (maxH-minH)/2;

// --- Flurstücksgrenzen (aus flurstueck.shp) ---
const parcelGroup = new THREE.Group();
PARCEL_LINES.forEach(ring => {
  const pts = ring.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
  const lineMat = new THREE.LineBasicMaterial({ color: 0xff2d2d, linewidth: 2, depthTest: true });
  parcelGroup.add(new THREE.Line(lineGeo, lineMat));
});
scene.add(parcelGroup);

// --- Nordpfeil (Norden = -Z Richtung) ---
const northDir = new THREE.Vector3(0,0,-1);
const northArrow = new THREE.ArrowHelper(northDir, new THREE.Vector3(-10,2,H+10), 25, 0xff4444, 6, 4);
scene.add(northArrow);

// --- Licht ---
const ambient = new THREE.AmbientLight(0x8899bb, 0.35);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -180; sun.shadow.camera.right = 180;
sun.shadow.camera.top = 180; sun.shadow.camera.bottom = -180;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 900;
sun.shadow.bias = -0.0008;
sun.target.position.set(centerX, centerY, centerZ);
scene.add(sun.target);
scene.add(sun);

const SUN_DIST = 400;

function updateSun() {
  const doy = parseFloat(document.getElementById('dateSlider').value);
  const hour = parseFloat(document.getElementById('timeSlider').value);
  const { date, dst } = buildUTCDate(doy, hour);
  const { azimuth, altitude } = sunPosition(date, LAT, LON);

  const eastComp  = -Math.cos(altitude) * Math.sin(azimuth);
  const southComp =  Math.cos(altitude) * Math.cos(azimuth);
  const upComp    =  Math.sin(altitude);

  sun.position.set(
    centerX + eastComp * SUN_DIST,
    Math.max(upComp,0.02) * SUN_DIST,
    centerZ + southComp * SUN_DIST
  );

  const belowHorizon = altitude <= 0;
  sun.visible = !belowHorizon;
  sun.intensity = belowHorizon ? 0 : 1.2 + 0.6*Math.sin(Math.max(altitude,0));
  ambient.intensity = belowHorizon ? 0.15 : 0.35;

  const dateDisp = new Date(Date.UTC(2026,0,1)); dateDisp.setUTCDate(doy);
  const dd = String(dateDisp.getUTCDate()).padStart(2,'0');
  const mm = String(dateDisp.getUTCMonth()+1).padStart(2,'0');
  document.getElementById('dateLabel').textContent = `${dd}.${mm}.2026`;
  const hh = Math.floor(hour), mi = Math.round((hour-hh)*60);
  document.getElementById('timeLabel').textContent = `${String(hh).padStart(2,'0')}:${String(mi).padStart(2,'0')} (${dst?'MESZ':'MEZ'})`;

  document.getElementById('readout').innerHTML =
    `Sonnenhöhe: <span>${(altitude/RAD).toFixed(1)}°</span><br>` +
    `Azimut (0=S, 90=W): <span>${(azimuth/RAD).toFixed(1)}°</span><br>` +
    (belowHorizon ? `<span id="warn">Sonne unter dem Horizont</span>` : '');
}

document.getElementById('dateSlider').addEventListener('input', updateSun);
document.getElementById('timeSlider').addEventListener('input', updateSun);
document.querySelectorAll('button[data-doy]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById('dateSlider').value = btn.dataset.doy;
    updateSun();
  });
});
updateSun();

// --- einfache Orbit-Steuerung (Drag = drehen, Scroll = zoomen) ---
let camTarget = new THREE.Vector3(centerX, centerY, centerZ);
let camAz = 0.7, camPolar = 1.0, camDist = 260;
let dragging = false, lastX = 0, lastY = 0;
function updateCamera() {
  const x = camTarget.x + camDist * Math.sin(camPolar) * Math.sin(camAz);
  const y = camTarget.y + camDist * Math.cos(camPolar);
  const z = camTarget.z + camDist * Math.sin(camPolar) * Math.cos(camAz);
  camera.position.set(x,y,z);
  camera.lookAt(camTarget);
}
renderer.domElement.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('mouseup', () => dragging = false);
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  camAz += (e.clientX - lastX) * 0.006;
  camPolar = Math.min(Math.max(camPolar - (e.clientY - lastY) * 0.006, 0.15), 1.5);
  lastX = e.clientX; lastY = e.clientY;
  updateCamera();
});
renderer.domElement.addEventListener('wheel', e => {
  camDist = Math.min(Math.max(camDist + e.deltaY * 0.25, 40), 700);
  updateCamera();
  e.preventDefault();
}, { passive:false });
updateCamera();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
</script>
